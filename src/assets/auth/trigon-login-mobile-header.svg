<svg xmlns="http://www.w3.org/2000/svg" width="390" height="300" viewBox="0 0 390 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="390" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1273d6"/>
      <stop offset="0.6" stop-color="#0a66c2"/>
      <stop offset="1" stop-color="#064a94"/>
    </linearGradient>
    <radialGradient id="hub" cx="195" cy="103" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fb0ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#5fb0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="-10" y1="215" x2="115" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="blur5" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="390" height="300" fill="url(#bg)"/>
  <rect width="390" height="300" fill="url(#hub)"/>

  <g stroke="#ffffff" stroke-opacity="0.06">
    <path d="M65 0V300M130 0V300M195 0V300M260 0V300M325 0V300"/>
    <path d="M0 60H390M0 120H390M0 180H390M0 240H390"/>
  </g>

  <g stroke="#ffffff" fill="none">
    <circle cx="195" cy="103" r="90" stroke-opacity="0.16"/>
    <circle cx="195" cy="103" r="150" stroke-opacity="0.10"/>
    <circle cx="195" cy="103" r="215" stroke-opacity="0.06"/>
  </g>

  <!-- left route (highlight) -->
  <path d="M-10 215C40 215 70 170 115 150" stroke="#8fd0ff" stroke-width="9" stroke-linecap="round" opacity="0.5" filter="url(#blur5)"/>
  <path d="M-10 215C40 215 70 170 115 150" stroke="url(#trail)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="115" cy="150" r="14" fill="#ffffff" fill-opacity="0.2"/>
  <circle cx="115" cy="150" r="6" fill="#ffffff"/>

  <!-- right route -->
  <path d="M400 50C345 50 335 95 318 130S300 175 262 182" stroke="#ffffff" stroke-opacity="0.38" stroke-width="3" stroke-linecap="round"/>
  <circle cx="262" cy="182" r="12" fill="#ffffff" fill-opacity="0.2"/>
  <circle cx="262" cy="182" r="5" fill="#ffffff"/>

  <!-- geofence + pin -->
  <path d="M322 96L360 118V162L322 184L284 162V118Z" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 5" stroke-linejoin="round"/>
  <circle cx="322" cy="140" r="16" fill="#ffffff" fill-opacity="0.16"/>
  <circle cx="322" cy="140" r="7" fill="#ffffff"/>
  <circle cx="322" cy="140" r="2.5" fill="#0a66c2"/>

  <!-- small live chip -->
  <rect x="36" y="64" width="128" height="30" rx="15" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
  <circle cx="54" cy="79" r="4" fill="#4ade80"/>
  <text x="66" y="83" font-family="Poppins, Segoe UI, Arial, sans-serif" font-weight="500" font-size="11" fill="#ffffff">128 vehicles live</text>
</svg>
